              e.preventDefault();

            if ((obj === window || obj === globalThis || (typeof Window !== "undefined" && obj === Window.prototype)) && prop === "fetch") {
              if (descriptor && descriptor.get && !descriptor.set) {
                var originalGet = descriptor.get;
                var customFetch = null;
                return {
                  configurable: true,
                  enumerable: descriptor.enumerable !== undefined ? descriptor.enumerable : true,
                  get: function() {
                    return customFetch !== null ? customFetch : originalGet.call(this);
                  },
                  set: function(val) {
                    customFetch = val;
                  }
                };
              }
            }
            return descriptor;
          }

          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            return origDefineProperty(obj, prop, patchDescriptor(obj, prop, descriptor));
          };

          if (typeof Reflect !== "undefined" && Reflect.defineProperty) {
            var origReflectDefineProperty = Reflect.defineProperty;
            Reflect.defineProperty = function(obj, prop, descriptor) {
              return origReflectDefineProperty(obj, prop, patchDescriptor(obj, prop, descriptor));
            };
          }
        }
      })();
